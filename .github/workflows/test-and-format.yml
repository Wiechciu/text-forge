name: Automated Tests
on: [push, pull_request]

jobs:
  formatting-gdunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Godot
        uses: firebelley/setup-godot@v2
        with:
          version: '4.4.1'
      - name: Import Godot Assets
        run: godot --headless --editor --quit
      - name: Test with GDUnit4
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: '4.4.1'
          paths: 'res://tests'
      - name: Format GDScript Code
        uses: quantum-defence/gdformatter@v0.1.5
        with:
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          labels: auto-format
          assignees: mkh-user
          reviewers: mkh-user
      - name: Checkout - Again
        uses: actions/checkout@v4
      - name: Test with GDUnit4 - Again
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: '4.4.1'
          paths: 'res://tests'
                
