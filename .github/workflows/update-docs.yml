name: Sync Docs to text-forge/docs

on:
  push:
    branches:
      - Main
    paths:
      - 'docs/**'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Copy docs to a temp folder
        run: |
          mkdir -p synced-docs
          cp -r docs/* synced-docs/

      - name: Checkout target docs repo
        uses: actions/checkout@v4
        with:
          repository: text-forge/docs
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: docs-repo

      - name: Sync docs to target repo
        run: |
          rm -rf docs-repo/docs/*
          cp -r synced-docs/* docs-repo/docs/
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update docs from text-forge/text-forge: ${{ github.sha }}"
          git push
